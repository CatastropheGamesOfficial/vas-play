<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>VTuber Agency Simulator — Shell Proto</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="rename-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-card">
      <h1>Name your studio</h1>
      <input id="studio-input" type="text" maxlength="28" placeholder="Generic Studio" autocomplete="off" />
      <button type="button" id="studio-confirm" class="modal-btn">That’s the one</button>
      <p class="modal-hint">Empty falls back to Generic Studio. Offline only — no ads, no IAP.</p>
    </div>
  </div>

  <div class="phone" id="app">
    <div class="note">offline · no ads · no iap</div>

    <header class="top-bar" id="top-bar">
      <span id="studio-name">Generic Studio</span>
      <span class="sep">·</span>
      <span>Day <span id="day">1</span></span>
      <span class="sep">·</span>
      <span class="money" id="money">$1,200</span>
      <span class="sep">·</span>
      <span class="fans" id="fans">340 fans</span>
      <button type="button" class="mute-btn" id="btn-mute" aria-pressed="false" aria-label="Mute sound">♪</button>
    </header>

    <div class="toast hidden" id="toast" role="status"></div>

    <section class="diorama" aria-label="Office dollhouse">
      <div class="iso-room">
        <div class="wall-back">
          <div class="whiteboard">Agency Goals<br/><small>✓ Grow Fans<br/>○ Collabs<br/>○ Events</small></div>
          <div class="cork"></div>
          <div class="shelf"></div>
        </div>
        <div class="floor">
          <div class="couch-zone" title="Rest couch">
            <div class="couch"></div>
            <div class="couch-label">Rest</div>
          </div>
          <div class="desks" id="desks"></div>
          <div class="wanderers" id="wanderers"></div>
        </div>
      </div>
    </section>

    <section class="roster" id="roster" aria-label="Talent roster"></section>

    <nav class="actions">
      <button type="button" class="btn assign" id="btn-assign">Assign</button>
      <button type="button" class="btn rest" id="btn-rest">Rest</button>
      <button type="button" class="btn endday" id="btn-endday">End Day</button>
    </nav>
  </div>

  <script src="game.js"></script>
  <script src="audio.js"></script>
</body>
</html>
